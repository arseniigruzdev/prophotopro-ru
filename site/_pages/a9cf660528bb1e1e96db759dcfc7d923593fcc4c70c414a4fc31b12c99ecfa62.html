<script>
(function () {
  function withUmami(fn, tries) {
    if (window.umami && window.umami.track) return fn();
    if ((tries || 0) < 20) setTimeout(function () { withUmami(fn, (tries || 0) + 1); }, 500);
  }
  function bare(host) { return host.replace(/^www\./, ''); }

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var u;
    try { u = new URL(a.href, location.href); } catch (_) { return; }
    if (!/^https?:$/.test(u.protocol) || bare(u.hostname) === bare(location.hostname)) return;
    withUmami(function () { window.umami.track('outbound', { url: u.href.slice(0, 500), domain: u.hostname }); });
  }, true);

  var KEY = 'sp_engaged';
  try { if (sessionStorage.getItem(KEY) === '1') return; } catch (_) {}
  var interacted = false, visibleMs = 0, last = Date.now();
  ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'].forEach(function (type) {
    addEventListener(type, function () { interacted = true; }, { passive: true, once: true });
  });
  var timer = setInterval(function () {
    var now = Date.now();
    if (document.visibilityState === 'visible') visibleMs += now - last;
    last = now;
    if (interacted && visibleMs >= 10000) {
      clearInterval(timer);
      withUmami(function () {
        window.umami.track('engaged');
        try { sessionStorage.setItem(KEY, '1'); } catch (_) {}
      });
    }
  }, 1000);
  setTimeout(function () { clearInterval(timer); }, 30 * 60 * 1000);
})();
