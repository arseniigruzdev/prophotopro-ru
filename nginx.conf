server {
listen 80;
root /usr/share/nginx/html;

# Traffic reaches this container through the trusted Dokploy reverse proxy.
set $public_proto $scheme;
if ($http_x_forwarded_proto ~* "^(http|https)$") { set $public_proto $http_x_forwarded_proto; }
if ($host != "prophotopro.ru") { return 301 https://prophotopro.ru$request_uri; }
if ($public_proto = "http") { return 301 https://prophotopro.ru$request_uri; }


location = /dist/d2/framework.5d7cd080.js {
  proxy_pass http://umami-z130tpk32zdxilgm3zptogxx.159.194.205.161.sslip.io/script.js;
  proxy_http_version 1.1;
  proxy_set_header Host umami-z130tpk32zdxilgm3zptogxx.159.194.205.161.sslip.io;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
}
location = /dist/d2/api/send {
  set $umami_client_ip $remote_addr;
  if ($http_x_real_ip != "") { set $umami_client_ip $http_x_real_ip; }
  if ($http_cf_connecting_ip != "") { set $umami_client_ip $http_cf_connecting_ip; }
  if ($http_x_forwarded_for ~ "^\s*([^,]+)") { set $umami_client_ip $1; }
  proxy_pass http://umami-z130tpk32zdxilgm3zptogxx.159.194.205.161.sslip.io/api/send;
  proxy_http_version 1.1;
  proxy_set_header Host umami-z130tpk32zdxilgm3zptogxx.159.194.205.161.sslip.io;
  proxy_set_header X-Real-IP $umami_client_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $public_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header CF-Connecting-IP $umami_client_ip;
  proxy_set_header True-Client-IP $umami_client_ip;
  proxy_set_header X-Umami-Client-IP $umami_client_ip;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_buffering off;
}

location = /health { return 200 "ok"; }
